name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to the project directory
            cd ${{ secrets.VPS_PROJECT_PATH }}
            
            # Reset local changes (except ignored files like .env) and pull latest main branch
            git fetch origin main
            git reset --hard origin/main
            
            # --- Build Backend (Server) ---
            cd server
            npm ci
            npx prisma generate
            npm run build
            
            # --- Build Frontend (Client) ---
            cd ../"Home Rituals"
            npm ci
            npm run build
            
            # --- Restart Backend Server ---
            # Restart the PM2 process. Will use the PM2_PROCESS_NAME secret or default to "home-rituals-server"
            pm2 restart ${{ secrets.PM2_PROCESS_NAME || 'home-rituals-server' }}
