name: Deploy Home Rituals

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          debug: true
          script: |
            exec > /var/www/html/deploy.log 2>&1
            echo "=== Deployment Start: $(date) ==="
            whoami
            pwd
            ls -la /root

            REPO_DIR=""
            if [ -d "/root/Home-rituals" ]; then
              REPO_DIR="/root/Home-rituals"
            elif [ -d "/root/Home-rituals-main" ]; then
              REPO_DIR="/root/Home-rituals-main"
            else
              REPO_DIR=$(find /root -maxdepth 2 -name "Home-rituals*" -type d | head -n 1)
            fi
            echo "Found REPO_DIR: $REPO_DIR"

            cd "$REPO_DIR"
            git status
            git remote -v
            git remote set-url origin https://github.com/srivastavaayush084/Home-rituals.git
            git fetch origin main
            git reset --hard origin/main

            echo "=== Building Frontend ==="
            cd "$REPO_DIR/Home Rituals"
            npm install
            npm run build
            cp -r dist/* /var/www/html/

            echo "=== Building Backend ==="
            cd "$REPO_DIR/server"
            npm install
            npx prisma generate
            npm run build
            pm2 restart home-rituals-api --update-env || pm2 start dist/index.js --name "home-rituals-api"
            pm2 save

            systemctl reload nginx
            echo "=== Deployment Finished Successfully: $(date) ==="
