name: Deploy Home Rituals

on:
  push:
    branches: [main]

jobs:
  validate-and-build:
    name: Build & Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            Home Rituals/package-lock.json

      - name: Install, Test & Build Backend
        run: |
          cd server
          npm ci
          npx prisma generate
          npm test
          npm run build

      - name: Install & Build Frontend
        run: |
          cd "Home Rituals"
          npm ci
          npm run build

  deploy:
    name: Deploy to Production VPS
    needs: [validate-and-build]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "=== Deployment Started: $(date) ==="
            whoami
            pwd

            REPO_DIR=""
            if [ -d "/root/Home-rituals" ]; then
              REPO_DIR="/root/Home-rituals"
            elif [ -d "/root/Home-rituals-main" ]; then
              REPO_DIR="/root/Home-rituals-main"
            elif [ -d "$HOME/Home-rituals" ]; then
              REPO_DIR="$HOME/Home-rituals"
            elif [ -d "$HOME/Home-rituals-main" ]; then
              REPO_DIR="$HOME/Home-rituals-main"
            else
              REPO_DIR=$(find /root "$HOME" -maxdepth 2 -name "Home-rituals*" -type d 2>/dev/null | head -n 1)
            fi
            echo "Found REPO_DIR: $REPO_DIR"

            cd "$REPO_DIR"
            git status
            git remote set-url origin https://github.com/srivastavaayush084/Home-rituals.git
            git fetch origin main
            git reset --hard origin/main

            echo "=== Deploying Frontend ==="
            cd "$REPO_DIR/Home Rituals"
            npm ci || npm install
            npm run build
            cp -r dist/* /var/www/html/

            echo "=== Deploying Backend ==="
            cd "$REPO_DIR/server"
            npm ci || npm install
            npx prisma generate
            npm run build

            echo "=== Restarting Backend Services ==="
            pm2 restart home-rituals-api --update-env || pm2 start dist/index.js --name "home-rituals-api"
            pm2 save

            echo "=== Process Status ==="
            pm2 status home-rituals-api

            echo "=== Reloading Web Server ==="
            systemctl reload nginx || sudo systemctl reload nginx

            echo "=== Verifying Service Health Check ==="
            sleep 3
            curl -f http://localhost:5000/api/health || (echo "DEPLOYMENT FAILED: Post-deployment health check failed!" && exit 1)

            echo "=== Deployment Finished Successfully: $(date) ==="
